name: bivfarm
description: "BivFarm - Agricultural Marketplace for Bunyoro Region"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/demo/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/Bfarm_icon.png"
  min_sdk_android: 21
