name: bivfarm
description: "BFarm - Agricultural Marketplace for Bunyoro Region"
publish_to: 'none'
version: 1.3.0+6

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^8.0.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  image_picker: ^1.1.2
  google_sign_in: 6.2.1
  cached_network_image: ^3.4.1
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  shimmer: ^3.0.0
  rxdart: ^0.27.7
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/carousel/
    - assets/images/categories/
    - assets/images/demo/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  web:
    generate: true
    image_path: "assets/images/Bfarm_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/images/Bfarm_icon.png"
  min_sdk_android: 21
